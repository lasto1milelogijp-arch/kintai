<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拠点QRコード一覧</title>
<style>body{font-family:sans-serif;margin:20px;color:#222}h1{text-align:center}.note{text-align:center;color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;max-width:1100px;margin:24px auto}.card{border:1px solid #ccc;border-radius:12px;padding:18px;text-align:center;break-inside:avoid}.name{font-size:20px;font-weight:bold;margin-bottom:4px}.id{color:#777;font-size:12px;margin-bottom:12px}.qr{display:flex;justify-content:center}.url{font-size:9px;color:#888;word-break:break-all;margin-top:10px}@media print{button,.note{display:none}.grid{grid-template-columns:repeat(3,1fr)}body{margin:0}.card{page-break-inside:avoid}}</style></head>
<body><h1>出退勤用QRコード</h1><p class="note">必要な拠点を印刷して入口に掲示してください。<button onclick="print()">印刷</button></p><div id="grid" class="grid">読み込み中…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxXaZ_4pZsL9EXWsFwNzHfjrcIe_I_9WK5JBmjoHZcO4ZW4YSorRpv5ad3L6IOLJkzZ/exec';
const LIFF_BASE='https://liff.line.me/2010310932-MO7e9yXF/qr.html?base=';
window.onload=function(){jsonp('action=base_list').then(function(d){const g=document.getElementById('grid'),rows=(d&&d.bases)||[];g.innerHTML='';rows.forEach(function(b){const u=LIFF_BASE+encodeURIComponent(b.id),c=document.createElement('div');c.className='card';c.innerHTML='<div class="name">'+esc(b.name)+'</div><div class="id">拠点ID：'+esc(b.id)+'</div><div class="qr"></div><div class="url">'+esc(u)+'</div>';g.appendChild(c);new QRCode(c.querySelector('.qr'),{text:u,width:180,height:180,correctLevel:QRCode.CorrectLevel.H});});if(!rows.length)g.textContent='拠点が登録されていません';}).catch(function(e){document.getElementById('grid').textContent=e.message;});};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function jsonp(qs){return new Promise(function(resolve,reject){const cb='cb_'+Date.now(),s=document.createElement('script');window[cb]=function(d){delete window[cb];s.remove();resolve(d);};s.onerror=function(){delete window[cb];s.remove();reject(new Error('拠点一覧を取得できません'));};s.src=GAS_URL+'?'+qs+'&callback='+cb;document.head.appendChild(s);});}
</script></body></html>
